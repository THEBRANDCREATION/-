<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BRAND CREATION - Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; }
        .google-btn { background: #4285F4; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .google-btn:hover { background: #357ae8; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>THE BRAND CREATION</h2>
        <p>वेबसाइट में प्रवेश करने के लिए Google से लॉगिन करें</p>
        <button class="google-btn" onclick="alert('Supabase Google OAuth कनेक्ट होने पर यह चालू हो जाएगा')">Continue with Google</button>
    </div>
</body>
</html>
