<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BRAND CREATION - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; margin-top: 50px; }
        .google-btn { background: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .google-btn:hover { background: #357ae8; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>THE BRAND CREATION</h2>
        <p>जारी रखने के लिए Google से लॉगिन करें</p>
        <button class="google-btn" onclick="loginWithGoogle()">Continue with Google</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://rtwlpnwijglyixeegsck.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_WBeyZvDXwqCkVcHUkmKLhw_ODbmsnDN';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loginWithGoogle() {
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
            });
            if (error) {
                alert('लॉगिन में एरर: ' + error.message);
            }
        }
    </script>
</body>
</html>
